AWSTemplateFormatVersion: "2010-09-09"
Description: AgentFormation App Runner web terminal and least-privilege service roles.

Parameters:
  DeploymentName:
    Type: String
    AllowedPattern: "^(?!.*-runtime-)[a-z][a-z0-9-]{2,31}$"
  ImageIdentifier:
    Type: String
    AllowedPattern: "^[0-9]{12}\\.dkr\\.ecr\\.[a-z0-9-]+\\.amazonaws\\.com(?:\\.cn)?/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$"
  PublicUrl:
    Type: String
    AllowedPattern: "^https://[A-Za-z0-9.-]+(?::[0-9]{1,5})?$"
  UserPoolClientId:
    Type: String
    AllowedPattern: "^[A-Za-z0-9]+$"
  UserPoolId:
    Type: String
    AllowedPattern: "^[A-Za-z0-9-]+_[A-Za-z0-9]+$"
  CognitoClientSecretArn:
    Type: String
    AllowedPattern: "^arn:[A-Za-z0-9-]+:secretsmanager:[A-Za-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+$"
  AuthSecretArn:
    Type: String
    AllowedPattern: "^arn:[A-Za-z0-9-]+:secretsmanager:[A-Za-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+$"
  UserRegistryTableName:
    Type: String
    MinLength: 3
    MaxLength: 255
    AllowedPattern: "^[A-Za-z0-9_.-]+$"
  ControlTableName:
    Type: String
    MinLength: 3
    MaxLength: 255
    AllowedPattern: "^[A-Za-z0-9_.-]+$"
  UploadBucketName:
    Type: String
    AllowedPattern: "^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$"
  TerminalSessionDocumentName:
    Type: String
    AllowedPattern: "^[A-Za-z0-9_.-]{3,128}$"
  UploadDeliveryDocumentName:
    Type: String
    AllowedPattern: "^[A-Za-z0-9_.-]{3,128}$"
  OAuthRelayDocumentName:
    Type: String
    AllowedPattern: "^[A-Za-z0-9_.-]{3,128}$"
  ProvisioningStateMachineArn:
    Type: String
    AllowedPattern: "^arn:[A-Za-z0-9-]+:states:[A-Za-z0-9-]+:[0-9]{12}:stateMachine:[A-Za-z0-9_+=.@-]+$"

Resources:
  EcrAccessRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: build.apprunner.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSAppRunnerServicePolicyForECRAccess"
      Tags:
        - { Key: AgentFormationDeployment, Value: !Ref DeploymentName }

  WebInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: tasks.apprunner.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReadAssignedRuntime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: dynamodb:GetItem
                Resource: !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${UserRegistryTableName}"
        - PolicyName: StartOwnRuntimeProvisioning
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Ref ProvisioningStateMachineArn
        - PolicyName: EnforceSharedRequestLimits
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:DeleteItem
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ControlTableName}"
        - PolicyName: ReadRuntimeProvisioningProgress
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: cloudformation:DescribeStackEvents
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${DeploymentName}-runtime-*/*"
        - PolicyName: ManageBrowserSessions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: StartTaggedRuntimeSession
                Effect: Allow
                Action: ssm:StartSession
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                Condition:
                  StringEquals:
                    "ssm:resourceTag/AgentFormationDeployment": !Ref DeploymentName
              - Sid: UseTerminalDocument
                Effect: Allow
                Action: ssm:StartSession
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/${TerminalSessionDocumentName}"
              - Sid: RunUploadCommand
                Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                Condition:
                  StringEquals:
                    "ssm:resourceTag/AgentFormationDeployment": !Ref DeploymentName
              - Sid: UseBoundedRuntimeCommandDocuments
                Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/${UploadDeliveryDocumentName}"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/${OAuthRelayDocumentName}"
              - Sid: ObserveUploadCommands
                Effect: Allow
                Action: [ssm:GetCommandInvocation, ssm:CancelCommand]
                Resource: "*"
              - Sid: ResumeAndEndBrowserSessionsInThisAccount
                Effect: Allow
                Action: [ssm:ResumeSession, ssm:TerminateSession]
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:session/*"
        - PolicyName: ManageUploadStaging
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:DeleteObject]
                Resource: !Sub "arn:${AWS::Partition}:s3:::${UploadBucketName}/uploads/*"
              - Effect: Allow
                Action: s3:GetBucketLocation
                Resource: !Sub "arn:${AWS::Partition}:s3:::${UploadBucketName}"
        - PolicyName: ReadApplicationSecrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref CognitoClientSecretArn, !Ref AuthSecretArn]
      Tags:
        - { Key: AgentFormationDeployment, Value: !Ref DeploymentName }

  AutoScalingConfiguration:
    Type: AWS::AppRunner::AutoScalingConfiguration
    Properties:
      AutoScalingConfigurationName: !Sub "${AWS::StackName}-scaling"
      MaxConcurrency: 20
      MaxSize: 3
      MinSize: 1
      Tags:
        - { Key: AgentFormationDeployment, Value: !Ref DeploymentName }

  WebService:
    Type: AWS::AppRunner::Service
    Properties:
      ServiceName: !Sub "${DeploymentName}-web"
      AutoScalingConfigurationArn: !Ref AutoScalingConfiguration
      SourceConfiguration:
        AuthenticationConfiguration:
          AccessRoleArn: !GetAtt EcrAccessRole.Arn
        AutoDeploymentsEnabled: false
        ImageRepository:
          ImageIdentifier: !Ref ImageIdentifier
          ImageRepositoryType: ECR
          ImageConfiguration:
            Port: "3000"
            RuntimeEnvironmentVariables:
              - { Name: NODE_ENV, Value: production }
              - { Name: AUTH_URL, Value: !Ref PublicUrl }
              - { Name: AUTH_TRUST_HOST, Value: "true" }
              - { Name: AWS_REGION, Value: !Ref AWS::Region }
              - { Name: AGENTFORMATION_DEPLOYMENT, Value: !Ref DeploymentName }
              - { Name: AUTH_COGNITO_ID, Value: !Ref UserPoolClientId }
              - {
                  Name: AUTH_COGNITO_ISSUER,
                  Value: !Sub "https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${UserPoolId}",
                }
              - { Name: AUTH_COGNITO_IDENTITY_PROVIDER, Value: IdentityCenter }
              - { Name: USER_REGISTRY_TABLE, Value: !Ref UserRegistryTableName }
              - { Name: CONTROL_TABLE, Value: !Ref ControlTableName }
              - {
                  Name: PROVISIONING_STATE_MACHINE_ARN,
                  Value: !Ref ProvisioningStateMachineArn,
                }
              - { Name: UPLOAD_BUCKET, Value: !Ref UploadBucketName }
              - {
                  Name: SESSION_DOCUMENT_NAME,
                  Value: !Ref TerminalSessionDocumentName,
                }
              - {
                  Name: UPLOAD_DELIVERY_DOCUMENT_NAME,
                  Value: !Ref UploadDeliveryDocumentName,
                }
              - {
                  Name: OAUTH_RELAY_DOCUMENT_NAME,
                  Value: !Ref OAuthRelayDocumentName,
                }
            RuntimeEnvironmentSecrets:
              - {
                  Name: AUTH_COGNITO_SECRET,
                  Value: !Ref CognitoClientSecretArn,
                }
              - { Name: AUTH_SECRET, Value: !Ref AuthSecretArn }
      InstanceConfiguration:
        Cpu: "1 vCPU"
        Memory: "2 GB"
        InstanceRoleArn: !GetAtt WebInstanceRole.Arn
      HealthCheckConfiguration:
        Protocol: HTTP
        Path: /api/health
        Interval: 10
        Timeout: 5
        HealthyThreshold: 1
        UnhealthyThreshold: 5
      Tags:
        - { Key: AgentFormationDeployment, Value: !Ref DeploymentName }

Outputs:
  ServiceArn:
    Value: !GetAtt WebService.ServiceArn
  ServiceUrl:
    Value: !Sub "https://${WebService.ServiceUrl}"
