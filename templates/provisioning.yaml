AWSTemplateFormatVersion: "2010-09-09"
Description: Restricted self-service provisioning for one AgentFormation runtime per federated user.

Parameters:
  DeploymentName:
    Type: String
    AllowedPattern: "^(?!.*-runtime-)[a-z][a-z0-9-]{2,31}$"
  UserPoolId:
    Type: String
    AllowedPattern: '^[A-Za-z0-9-]+_[A-Za-z0-9]+$'
  UserRegistryTableName:
    Type: String
    MinLength: 3
    MaxLength: 255
    AllowedPattern: '^[A-Za-z0-9_.-]+$'
  RuntimeTemplateBucket:
    Type: String
    AllowedPattern: '^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$'
  RuntimeTemplateKey:
    Type: String
    AllowedPattern: '^provisioning/runtime-[0-9a-f]{64}\.yaml$'
  RuntimeSubnetId:
    Type: AWS::EC2::Subnet::Id
  RuntimeSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  RuntimeAmiId:
    Type: AWS::EC2::Image::Id
  InstanceType:
    Type: String
    AllowedValues:
      [
        t4g.medium,
        t4g.large,
        c7g.large,
        c7g.xlarge,
        m7g.large,
        m7g.xlarge,
        t3.medium,
        t3.large,
        c7i.large,
        c7i.xlarge,
        m7i.large,
        m7i.xlarge,
      ]
  Architecture:
    Type: String
    AllowedValues: [arm64, x86_64]
  VolumeSizeGiB:
    Type: String
    AllowedPattern: "^(2[0-9]|[3-9][0-9]|[1-9][0-9]{2}|10[0-1][0-9]|102[0-4])$"
  ClaudeModelId:
    Type: String
    MinLength: 1
    MaxLength: 256
    AllowedPattern: "^[A-Za-z0-9._:/-]+$"
  ClaudeInferenceProfileArn:
    Type: String
    AllowedPattern: '^arn:[A-Za-z0-9-]+:bedrock:[A-Za-z0-9-]+:([0-9]{12})?:(inference-profile|application-inference-profile)/[A-Za-z0-9._:-]+$'
  ClaudeFoundationModelArns:
    Type: CommaDelimitedList
    AllowedPattern: '^arn:[A-Za-z0-9-]+:bedrock:[A-Za-z0-9-]+::foundation-model/[A-Za-z0-9._:-]+$'
  CodexModelId:
    Type: String
    MinLength: 1
    MaxLength: 256
    AllowedPattern: "^[A-Za-z0-9._:/-]+$"
  UploadBucketName:
    Type: String
    AllowedPattern: '^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$'

Rules:
  MatchArchitectureAndRuntime:
    Assertions:
      - Assert: !Or
          - !And
            - !Equals [!Ref Architecture, arm64]
            - !Contains [[t4g.medium, t4g.large, c7g.large, c7g.xlarge, m7g.large, m7g.xlarge], !Ref InstanceType]
          - !And
            - !Equals [!Ref Architecture, x86_64]
            - !Contains [[t3.medium, t3.large, c7i.large, c7i.xlarge, m7i.large, m7i.xlarge], !Ref InstanceType]
        AssertDescription: Runtime instance type must match the selected AMI architecture.

Resources:
  RuntimePermissionsBoundaryPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${DeploymentName}-runtime-boundary"
      Description: Maximum permissions for AgentFormation runtime instance roles.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: UseSystemsManagerAgent
            Effect: Allow
            Action:
              - ssm:DescribeAssociation
              - ssm:GetDeployablePatchSnapshotForInstance
              - ssm:GetDocument
              - ssm:DescribeDocument
              - ssm:GetManifest
              - ssm:GetParameter
              - ssm:GetParameters
              - ssm:ListAssociations
              - ssm:ListInstanceAssociations
              - ssm:PutInventory
              - ssm:PutComplianceItems
              - ssm:PutConfigurePackageResult
              - ssm:UpdateAssociationStatus
              - ssm:UpdateInstanceAssociationStatus
              - ssm:UpdateInstanceInformation
              - ssmmessages:CreateControlChannel
              - ssmmessages:CreateDataChannel
              - ssmmessages:OpenControlChannel
              - ssmmessages:OpenDataChannel
              - ec2messages:AcknowledgeMessage
              - ec2messages:DeleteMessage
              - ec2messages:FailMessage
              - ec2messages:GetEndpoint
              - ec2messages:GetMessages
              - ec2messages:SendReply
            Resource: "*"
          - Sid: InvokeConfiguredInferenceProfile
            Effect: Allow
            Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
            Resource: !Ref ClaudeInferenceProfileArn
          - Sid: InvokeConfiguredFoundationModelsThroughProfile
            Effect: Allow
            Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
            Resource: !Ref ClaudeFoundationModelArns
            Condition:
              StringEquals:
                bedrock:InferenceProfileArn: !Ref ClaudeInferenceProfileArn
          - Sid: ListModelMetadata
            Effect: Allow
            Action: [bedrock:ListFoundationModels, bedrock:ListInferenceProfiles]
            Resource: "*"
          - Sid: ReadConfiguredFoundationModels
            Effect: Allow
            Action: bedrock:GetFoundationModel
            Resource: !Ref ClaudeFoundationModelArns
          - Sid: ReadConfiguredInferenceProfile
            Effect: Allow
            Action: bedrock:GetInferenceProfile
            Resource: !Ref ClaudeInferenceProfileArn
          - Sid: InvokeConfiguredOpenAIModel
            Effect: Allow
            Action: bedrock-mantle:CreateInference
            Resource: !Sub "arn:${AWS::Partition}:bedrock-mantle:${AWS::Region}:${AWS::AccountId}:project/default"
            Condition:
              StringEquals:
                bedrock-mantle:Model: !Ref CodexModelId
          - Sid: AllowMantleModelAutoEnablement
            Effect: Allow
            Action: [aws-marketplace:Subscribe, aws-marketplace:ViewSubscriptions]
            Resource: "*"
            Condition:
              StringEquals:
                aws:CalledViaLast: bedrock-mantle.amazonaws.com
          - Sid: ReadDeploymentUploads
            Effect: Allow
            Action: s3:GetObject
            Resource: !Sub "arn:${AWS::Partition}:s3:::${UploadBucketName}/uploads/*"
          - Sid: LocateDeploymentUploadBucket
            Effect: Allow
            Action: s3:GetBucketLocation
            Resource: !Sub "arn:${AWS::Partition}:s3:::${UploadBucketName}"

  RuntimeCloudFormationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${DeploymentName}-runtime-cfn"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudformation.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ManageRuntimeIam
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CreateBoundaryConstrainedRuntimeRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:PutRolePermissionsBoundary
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${DeploymentName}-runtime-*"
                Condition:
                  ArnEquals:
                    iam:PermissionsBoundary: !Ref RuntimePermissionsBoundaryPolicy
              - Sid: ManageNamedRuntimeRoles
                Effect: Allow
                Action:
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:DeleteRolePermissionsBoundary
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:ListInstanceProfilesForRole
                  - iam:TagRole
                  - iam:UntagRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${DeploymentName}-runtime-*"
              - Sid: AttachOnlySystemsManagerCore
                Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${DeploymentName}-runtime-*"
                Condition:
                  ArnEquals:
                    iam:PolicyARN: !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"
              - Sid: ManageNamedRuntimeInstanceProfiles
                Effect: Allow
                Action:
                  - iam:CreateInstanceProfile
                  - iam:DeleteInstanceProfile
                  - iam:GetInstanceProfile
                  - iam:AddRoleToInstanceProfile
                  - iam:RemoveRoleFromInstanceProfile
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/${DeploymentName}-runtime-*"
              - Sid: PassOnlyRuntimeRolesToEc2
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${DeploymentName}-runtime-*"
                Condition:
                  StringEquals:
                    iam:PassedToService: ec2.amazonaws.com
              - Sid: NeverMutateOrPassTheControlRole
                Effect: Deny
                NotAction:
                  - iam:Get*
                  - iam:List*
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${DeploymentName}-runtime-cfn"
        - PolicyName: ManageRuntimeInstances
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: UseReviewedRuntimeDependencies
                Effect: Allow
                Action: ec2:RunInstances
                Resource:
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}::image/${RuntimeAmiId}"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/${RuntimeSubnetId}"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/${RuntimeSecurityGroupId}"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*"
              - Sid: LaunchTaggedRuntimeInstance
                Effect: Allow
                Action: ec2:RunInstances
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                Condition:
                  StringEquals:
                    "aws:RequestTag/AgentFormationDeployment": !Ref DeploymentName
              - Sid: TagRuntimeDuringLaunch
                Effect: Allow
                Action: ec2:CreateTags
                Resource: "*"
                Condition:
                  StringEquals:
                    ec2:CreateAction: RunInstances
              - Sid: RemoveDeploymentRuntime
                Effect: Allow
                Action: ec2:TerminateInstances
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                Condition:
                  StringEquals:
                    "ec2:ResourceTag/AgentFormationDeployment": !Ref DeploymentName
              - Sid: ReadRuntimeState
                Effect: Allow
                Action:
                  - ec2:DescribeImages
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceAttribute
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSubnets
                  - ec2:DescribeTags
                  - ec2:DescribeVolumes
                Resource: "*"
      Tags:
        - { Key: AgentFormationDeployment, Value: !Ref DeploymentName }

  ProvisioningStateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${DeploymentName}-provisioning-sfn"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: states.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReadReviewedRuntimeTemplate
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::${RuntimeTemplateBucket}/${RuntimeTemplateKey}"
        - PolicyName: ValidateFederatedUser
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: cognito-idp:ListUsers
                Resource: !Sub "arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${UserPoolId}"
        - PolicyName: UpdateProvisioningRegistry
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: dynamodb:UpdateItem
                Resource: !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${UserRegistryTableName}"
        - PolicyName: CreateRestrictedRuntimeStack
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: cloudformation:CreateStack
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${DeploymentName}-runtime-*/*"
                Condition:
                  StringEquals:
                    cloudformation:RoleArn: !GetAtt RuntimeCloudFormationRole.Arn
                    cloudformation:TemplateUrl: !Sub "https://${RuntimeTemplateBucket}.s3.${AWS::Region}.${AWS::URLSuffix}/${RuntimeTemplateKey}"
              - Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackResource
                  - cloudformation:DeleteStack
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${DeploymentName}-runtime-*/*"
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt RuntimeCloudFormationRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
      Tags:
        - { Key: AgentFormationDeployment, Value: !Ref DeploymentName }

  RuntimeProvisioningStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub "${DeploymentName}-runtime-provisioning"
      StateMachineType: STANDARD
      RoleArn: !GetAtt ProvisioningStateMachineRole.Arn
      Definition:
        TimeoutSeconds: 5400
        Comment: Validate one federated user and create only that user's reviewed AgentFormation runtime stack.
        StartAt: PrepareSubjectParts
        States:
          PrepareSubjectParts:
            Type: Pass
            Parameters:
              "subject.$": $.subject
              "email.$": $.email
              "requestedAt.$": $.requestedAt
              "staleBefore.$": $.staleBefore
              "subjectParts.$": States.StringSplit($.subject, '-')
            Next: PrepareRuntimeInput
          PrepareRuntimeInput:
            Type: Pass
            Parameters:
              "subject.$": $.subject
              "email.$": $.email
              "requestedAt.$": $.requestedAt
              "staleBefore.$": $.staleBefore
              "stackName.$": !Sub "States.Format('${DeploymentName}-runtime-{}{}{}', States.ArrayGetItem($.subjectParts, 0), States.ArrayGetItem($.subjectParts, 1), States.ArrayGetItem($.subjectParts, 2))"
              stackPollAttempts: 0
              priorCleanupPollAttempts: 0
              failedCleanupPollAttempts: 0
            Next: FindFederatedUser
          FindFederatedUser:
            Type: Task
            Resource: !Sub "arn:${AWS::Partition}:states:::aws-sdk:cognitoidentityprovider:listUsers"
            Parameters:
              UserPoolId: !Ref UserPoolId
              "Filter.$": 'States.Format(''sub = "{}"'', $.subject)'
              Limit: 2
            ResultPath: $.identity
            Retry:
              - ErrorEquals: [States.TaskFailed]
                IntervalSeconds: 2
                MaxAttempts: 4
                BackoffRate: 2
                MaxDelaySeconds: 15
                JitterStrategy: FULL
            Next: RequireOneFederatedUser
          RequireOneFederatedUser:
            Type: Choice
            Choices:
              - And:
                  - Variable: $.identity.Users[0].Username
                    IsPresent: true
                  - Variable: $.identity.Users[0].Enabled
                    BooleanEquals: true
                  - Not:
                      Variable: $.identity.Users[1].Username
                      IsPresent: true
                Next: RegisterProvisioning
            Default: InvalidIdentity
          RegisterProvisioning:
            Type: Task
            Resource: !Sub "arn:${AWS::Partition}:states:::aws-sdk:dynamodb:updateItem"
            Parameters:
              TableName: !Ref UserRegistryTableName
              Key:
                userSub: { "S.$": $.subject }
              UpdateExpression: "SET #email = :email, #stack = :stackName, #status = :provisioning, #startedAt = :requestedAt, #execution = :execution, #updatedAt = :requestedAt REMOVE #instance"
              ConditionExpression: "attribute_not_exists(userSub) OR #status = :failed OR (#status = :provisioning AND #startedAt = :requestedAt AND #stack = :stackName AND #execution = :execution) OR (#status = :provisioning AND ((attribute_exists(#startedAt) AND #startedAt < :staleBefore) OR (attribute_not_exists(#startedAt) AND #updatedAt < :staleBefore)))"
              ExpressionAttributeNames:
                "#email": email
                "#stack": runtimeStackName
                "#status": status
                "#startedAt": provisioningStartedAt
                "#execution": provisioningExecutionId
                "#updatedAt": updatedAt
                "#instance": instanceId
              ExpressionAttributeValues:
                ":email": { "S.$": $.email }
                ":stackName": { "S.$": $.stackName }
                ":failed": { S: failed }
                ":provisioning": { S: provisioning }
                ":requestedAt": { "S.$": $.requestedAt }
                ":execution": { "S.$": "$$.Execution.Id" }
                ":staleBefore": { "S.$": $.staleBefore }
            ResultPath: $.registryWrite
            Retry:
              - ErrorEquals:
                  - DynamoDb.ConditionalCheckFailedException
                  - DynamoDB.ConditionalCheckFailedException
                MaxAttempts: 0
              - ErrorEquals: [States.TaskFailed]
                IntervalSeconds: 2
                MaxAttempts: 4
                BackoffRate: 2
                MaxDelaySeconds: 15
                JitterStrategy: FULL
            Catch:
              - ErrorEquals:
                  - DynamoDb.ConditionalCheckFailedException
                  - DynamoDB.ConditionalCheckFailedException
                ResultPath: $.duplicate
                Next: AlreadyProvisioned
            Next: InspectPriorRuntimeStack
          InspectPriorRuntimeStack:
            Type: Task
            Resource: !Sub "arn:${AWS::Partition}:states:::aws-sdk:cloudformation:describeStacks"
            Parameters:
              "StackName.$": $.stackName
            ResultPath: $.priorStack
            Retry:
              - ErrorEquals: [CloudFormation.ValidationErrorException]
                MaxAttempts: 0
              - ErrorEquals: [States.TaskFailed]
                IntervalSeconds: 2
                MaxAttempts: 4
                BackoffRate: 2
                MaxDelaySeconds: 15
                JitterStrategy: FULL
            Catch:
              - ErrorEquals: [CloudFormation.ValidationErrorException]
                ResultPath: $.priorStackMissing
                Next: ResetRuntimePolls
              - ErrorEquals: [States.ALL]
                ResultPath: $.provisioningError
                Next: MarkProvisioningFailed
            Next: DeletePriorRuntimeStack
          DeletePriorRuntimeStack:
            Type: Task
            Resource: !Sub "arn:${AWS::Partition}:states:::aws-sdk:cloudformation:deleteStack"
            Parameters:
              "StackName.$": $.stackName
              RoleARN: !GetAtt RuntimeCloudFormationRole.Arn
            ResultPath: $.deletePriorStack
            Retry:
              - ErrorEquals: [CloudFormation.ValidationErrorException]
                MaxAttempts: 0
              - ErrorEquals: [States.TaskFailed]
                IntervalSeconds: 2
                MaxAttempts: 4
                BackoffRate: 2
                MaxDelaySeconds: 15
                JitterStrategy: FULL
            Catch:
              - ErrorEquals: [CloudFormation.ValidationErrorException]
                ResultPath: $.priorStackMissing
                Next: ResetRuntimePolls
              - ErrorEquals: [States.ALL]
                ResultPath: $.provisioningError
                Next: MarkProvisioningFailed
            Next: CanWaitForPriorStackDeletion
          CanWaitForPriorStackDeletion:
            Type: Choice
            Choices:
              - Variable: $.priorCleanupPollAttempts
                NumericLessThan: 60
                Next: IncrementPriorCleanupPoll
            Default: MarkProvisioningFailed
          IncrementPriorCleanupPoll:
            Type: Pass
            Parameters:
              "subject.$": $.subject
              "email.$": $.email
              "requestedAt.$": $.requestedAt
              "staleBefore.$": $.staleBefore
              "stackName.$": $.stackName
              "stackPollAttempts.$": $.stackPollAttempts
              "priorCleanupPollAttempts.$": States.MathAdd($.priorCleanupPollAttempts, 1)
              "failedCleanupPollAttempts.$": $.failedCleanupPollAttempts
            Next: WaitForPriorStackDeletion
          WaitForPriorStackDeletion:
            Type: Wait
            Seconds: 15
            Next: ReadPriorStackDeletion
          ReadPriorStackDeletion:
            Type: Task
            Resource: !Sub "arn:${AWS::Partition}:states:::aws-sdk:cloudformation:describeStacks"
            Parameters:
              "StackName.$": $.stackName
            ResultPath: $.priorStack
            Retry:
              - ErrorEquals: [CloudFormation.ValidationErrorException]
                MaxAttempts: 0
              - ErrorEquals: [States.TaskFailed]
                IntervalSeconds: 2
                MaxAttempts: 4
                BackoffRate: 2
                MaxDelaySeconds: 15
                JitterStrategy: FULL
            Catch:
              - ErrorEquals: [CloudFormation.ValidationErrorException]
                ResultPath: $.priorStackMissing
                Next: ResetRuntimePolls
              - ErrorEquals: [States.ALL]
                ResultPath: $.provisioningError
                Next: MarkProvisioningFailed
            Next: CheckPriorStackDeletion
          CheckPriorStackDeletion:
            Type: Choice
            Choices:
              - Variable: $.priorStack.Stacks[0].StackStatus
                StringEquals: DELETE_FAILED
                Next: MarkProvisioningFailed
            Default: CanWaitForPriorStackDeletion
          ResetRuntimePolls:
            Type: Pass
            Parameters:
              "subject.$": $.subject
              "email.$": $.email
              "requestedAt.$": $.requestedAt
              "staleBefore.$": $.staleBefore
              "stackName.$": $.stackName
              stackPollAttempts: 0
              "priorCleanupPollAttempts.$": $.priorCleanupPollAttempts
              failedCleanupPollAttempts: 0
            Next: CreateRuntimeStack
          CreateRuntimeStack:
            Type: Task
            Resource: !Sub "arn:${AWS::Partition}:states:::aws-sdk:cloudformation:createStack"
            Parameters:
              "StackName.$": $.stackName
              "ClientRequestToken.$": $$.Execution.Name
              TemplateURL: !Sub "https://${RuntimeTemplateBucket}.s3.${AWS::Region}.${AWS::URLSuffix}/${RuntimeTemplateKey}"
              RoleARN: !GetAtt RuntimeCloudFormationRole.Arn
              Capabilities: [CAPABILITY_NAMED_IAM]
              OnFailure: DELETE
              TimeoutInMinutes: 30
              Parameters:
                - ParameterKey: DeploymentName
                  ParameterValue: !Ref DeploymentName
                - ParameterKey: RuntimeSubnetId
                  ParameterValue: !Ref RuntimeSubnetId
                - ParameterKey: RuntimeSecurityGroupId
                  ParameterValue: !Ref RuntimeSecurityGroupId
                - ParameterKey: RuntimePermissionsBoundaryArn
                  ParameterValue: !Ref RuntimePermissionsBoundaryPolicy
                - ParameterKey: UserSubject
                  "ParameterValue.$": $.subject
                - ParameterKey: AmiId
                  ParameterValue: !Ref RuntimeAmiId
                - ParameterKey: InstanceType
                  ParameterValue: !Ref InstanceType
                - ParameterKey: Architecture
                  ParameterValue: !Ref Architecture
                - ParameterKey: VolumeSizeGiB
                  ParameterValue: !Ref VolumeSizeGiB
                - ParameterKey: ClaudeModelId
                  ParameterValue: !Ref ClaudeModelId
                - ParameterKey: ClaudeInferenceProfileArn
                  ParameterValue: !Ref ClaudeInferenceProfileArn
                - ParameterKey: ClaudeFoundationModelArns
                  ParameterValue: !Join [",", !Ref ClaudeFoundationModelArns]
                - ParameterKey: CodexModelId
                  ParameterValue: !Ref CodexModelId
                - ParameterKey: UploadBucketName
                  ParameterValue: !Ref UploadBucketName
              Tags:
                - Key: AgentFormationDeployment
                  Value: !Ref DeploymentName
                - Key: AgentFormationUserSubject
                  "Value.$": $.subject
            ResultPath: $.createStack
            Retry:
              - ErrorEquals: [States.TaskFailed]
                IntervalSeconds: 2
                MaxAttempts: 4
                BackoffRate: 2
                MaxDelaySeconds: 15
                JitterStrategy: FULL
            Catch:
              - ErrorEquals: [States.ALL]
                ResultPath: $.provisioningError
                Next: BeginFailedStackCleanup
            Next: CanWaitForRuntimeStack
          CanWaitForRuntimeStack:
            Type: Choice
            Choices:
              - Variable: $.stackPollAttempts
                NumericLessThan: 140
                Next: IncrementRuntimeStackPoll
            Default: BeginFailedStackCleanup
          IncrementRuntimeStackPoll:
            Type: Pass
            Parameters:
              "subject.$": $.subject
              "email.$": $.email
              "requestedAt.$": $.requestedAt
              "staleBefore.$": $.staleBefore
              "stackName.$": $.stackName
              "stackPollAttempts.$": States.MathAdd($.stackPollAttempts, 1)
              "priorCleanupPollAttempts.$": $.priorCleanupPollAttempts
              "failedCleanupPollAttempts.$": $.failedCleanupPollAttempts
            Next: WaitForRuntimeStack
          WaitForRuntimeStack:
            Type: Wait
            Seconds: 15
            Next: ReadRuntimeStack
          ReadRuntimeStack:
            Type: Task
            Resource: !Sub "arn:${AWS::Partition}:states:::aws-sdk:cloudformation:describeStacks"
            Parameters:
              "StackName.$": $.stackName
            ResultPath: $.stack
            Retry:
              - ErrorEquals: [States.TaskFailed]
                IntervalSeconds: 2
                MaxAttempts: 4
                BackoffRate: 2
                MaxDelaySeconds: 15
                JitterStrategy: FULL
            Catch:
              - ErrorEquals: [States.ALL]
                ResultPath: $.provisioningError
                Next: BeginFailedStackCleanup
            Next: CheckRuntimeStack
          CheckRuntimeStack:
            Type: Choice
            Choices:
              - Variable: $.stack.Stacks[0].StackStatus
                StringEquals: CREATE_COMPLETE
                Next: FindRuntimeInstance
              - Variable: $.stack.Stacks[0].StackStatus
                StringMatches: "*_IN_PROGRESS"
                Next: CanWaitForRuntimeStack
            Default: BeginFailedStackCleanup
          FindRuntimeInstance:
            Type: Task
            Resource: !Sub "arn:${AWS::Partition}:states:::aws-sdk:cloudformation:describeStackResource"
            Parameters:
              "StackName.$": $.stackName
              LogicalResourceId: RuntimeInstance
            ResultPath: $.runtime
            Retry:
              - ErrorEquals: [States.TaskFailed]
                IntervalSeconds: 2
                MaxAttempts: 4
                BackoffRate: 2
                MaxDelaySeconds: 15
                JitterStrategy: FULL
            Catch:
              - ErrorEquals: [States.ALL]
                ResultPath: $.provisioningError
                Next: BeginFailedStackCleanup
            Next: RequireRuntimeInstance
          RequireRuntimeInstance:
            Type: Choice
            Choices:
              - Variable: $.runtime.StackResourceDetail.PhysicalResourceId
                IsPresent: true
                Next: RecheckFederatedUser
            Default: BeginFailedStackCleanup
          RecheckFederatedUser:
            Type: Task
            Resource: !Sub "arn:${AWS::Partition}:states:::aws-sdk:cognitoidentityprovider:listUsers"
            Parameters:
              UserPoolId: !Ref UserPoolId
              "Filter.$": 'States.Format(''sub = "{}"'', $.subject)'
              Limit: 2
            ResultPath: $.identity
            Retry:
              - ErrorEquals: [States.TaskFailed]
                IntervalSeconds: 2
                MaxAttempts: 6
                BackoffRate: 2
                MaxDelaySeconds: 20
                JitterStrategy: FULL
            Catch:
              - ErrorEquals: [States.ALL]
                ResultPath: $.provisioningError
                Next: BeginFailedStackCleanup
            Next: RequireStillFederatedUser
          RequireStillFederatedUser:
            Type: Choice
            Choices:
              - And:
                  - Variable: $.identity.Users[0].Username
                    IsPresent: true
                  - Variable: $.identity.Users[0].Enabled
                    BooleanEquals: true
                  - Not:
                      Variable: $.identity.Users[1].Username
                      IsPresent: true
                Next: ActivateRuntime
            Default: BeginFailedStackCleanup
          ActivateRuntime:
            Type: Task
            Resource: !Sub "arn:${AWS::Partition}:states:::aws-sdk:dynamodb:updateItem"
            Parameters:
              TableName: !Ref UserRegistryTableName
              Key:
                userSub: { "S.$": $.subject }
              UpdateExpression: "SET #status = :active, instanceId = :instanceId, updatedAt = :updatedAt REMOVE #execution"
              ConditionExpression: "#status = :provisioning AND runtimeStackName = :stackName AND provisioningStartedAt = :requestedAt AND #execution = :execution"
              ExpressionAttributeNames:
                "#status": status
                "#execution": provisioningExecutionId
              ExpressionAttributeValues:
                ":active": { S: active }
                ":provisioning": { S: provisioning }
                ":requestedAt": { "S.$": $.requestedAt }
                ":execution": { "S.$": "$$.Execution.Id" }
                ":instanceId":
                  { "S.$": "$.runtime.StackResourceDetail.PhysicalResourceId" }
                ":stackName": { "S.$": $.stackName }
                ":updatedAt": { "S.$": $$.State.EnteredTime }
            ResultPath: $.registryWrite
            Retry:
              - ErrorEquals:
                  - DynamoDb.ConditionalCheckFailedException
                  - DynamoDB.ConditionalCheckFailedException
                MaxAttempts: 0
              - ErrorEquals: [States.TaskFailed]
                IntervalSeconds: 2
                MaxAttempts: 6
                BackoffRate: 2
                MaxDelaySeconds: 20
                JitterStrategy: FULL
            Catch:
              - ErrorEquals: [States.ALL]
                ResultPath: $.provisioningError
                Next: BeginFailedStackCleanup
            Next: RuntimeReady
          BeginFailedStackCleanup:
            Type: Task
            Resource: !Sub "arn:${AWS::Partition}:states:::aws-sdk:cloudformation:deleteStack"
            Parameters:
              "StackName.$": $.stackName
              RoleARN: !GetAtt RuntimeCloudFormationRole.Arn
            ResultPath: $.deleteFailedStack
            Retry:
              - ErrorEquals: [CloudFormation.ValidationErrorException]
                MaxAttempts: 0
              - ErrorEquals: [States.TaskFailed]
                IntervalSeconds: 2
                MaxAttempts: 4
                BackoffRate: 2
                MaxDelaySeconds: 15
                JitterStrategy: FULL
            Catch:
              - ErrorEquals: [CloudFormation.ValidationErrorException]
                ResultPath: $.failedStackMissing
                Next: MarkProvisioningFailed
              - ErrorEquals: [States.ALL]
                ResultPath: $.cleanupError
                Next: MarkProvisioningFailed
            Next: CanWaitForFailedStackDeletion
          CanWaitForFailedStackDeletion:
            Type: Choice
            Choices:
              - Variable: $.failedCleanupPollAttempts
                NumericLessThan: 60
                Next: IncrementFailedCleanupPoll
            Default: MarkProvisioningFailed
          IncrementFailedCleanupPoll:
            Type: Pass
            Parameters:
              "subject.$": $.subject
              "email.$": $.email
              "requestedAt.$": $.requestedAt
              "staleBefore.$": $.staleBefore
              "stackName.$": $.stackName
              "stackPollAttempts.$": $.stackPollAttempts
              "priorCleanupPollAttempts.$": $.priorCleanupPollAttempts
              "failedCleanupPollAttempts.$": States.MathAdd($.failedCleanupPollAttempts, 1)
            Next: WaitForFailedStackDeletion
          WaitForFailedStackDeletion:
            Type: Wait
            Seconds: 15
            Next: ReadFailedStackDeletion
          ReadFailedStackDeletion:
            Type: Task
            Resource: !Sub "arn:${AWS::Partition}:states:::aws-sdk:cloudformation:describeStacks"
            Parameters:
              "StackName.$": $.stackName
            ResultPath: $.failedStack
            Retry:
              - ErrorEquals: [CloudFormation.ValidationErrorException]
                MaxAttempts: 0
              - ErrorEquals: [States.TaskFailed]
                IntervalSeconds: 2
                MaxAttempts: 4
                BackoffRate: 2
                MaxDelaySeconds: 15
                JitterStrategy: FULL
            Catch:
              - ErrorEquals: [CloudFormation.ValidationErrorException]
                ResultPath: $.failedStackMissing
                Next: MarkProvisioningFailed
              - ErrorEquals: [States.ALL]
                ResultPath: $.cleanupError
                Next: MarkProvisioningFailed
            Next: CheckFailedStackDeletion
          CheckFailedStackDeletion:
            Type: Choice
            Choices:
              - Variable: $.failedStack.Stacks[0].StackStatus
                StringEquals: DELETE_FAILED
                Next: MarkProvisioningFailed
            Default: CanWaitForFailedStackDeletion
          MarkProvisioningFailed:
            Type: Task
            Resource: !Sub "arn:${AWS::Partition}:states:::aws-sdk:dynamodb:updateItem"
            Parameters:
              TableName: !Ref UserRegistryTableName
              Key:
                userSub: { "S.$": $.subject }
              UpdateExpression: "SET #status = :failed, updatedAt = :updatedAt REMOVE #execution"
              ConditionExpression: "#status = :provisioning AND runtimeStackName = :stackName AND provisioningStartedAt = :requestedAt AND #execution = :execution"
              ExpressionAttributeNames:
                "#status": status
                "#execution": provisioningExecutionId
              ExpressionAttributeValues:
                ":failed": { S: failed }
                ":provisioning": { S: provisioning }
                ":requestedAt": { "S.$": $.requestedAt }
                ":execution": { "S.$": "$$.Execution.Id" }
                ":stackName": { "S.$": $.stackName }
                ":updatedAt": { "S.$": $$.State.EnteredTime }
            ResultPath: $.registryWrite
            Retry:
              - ErrorEquals:
                  - DynamoDb.ConditionalCheckFailedException
                  - DynamoDB.ConditionalCheckFailedException
                MaxAttempts: 0
              - ErrorEquals: [States.TaskFailed]
                IntervalSeconds: 2
                MaxAttempts: 4
                BackoffRate: 2
                MaxDelaySeconds: 15
                JitterStrategy: FULL
            Catch:
              - ErrorEquals:
                  - DynamoDb.ConditionalCheckFailedException
                  - DynamoDB.ConditionalCheckFailedException
                ResultPath: $.superseded
                Next: ProvisioningSuperseded
            Next: ProvisioningFailed
          AlreadyProvisioned:
            Type: Succeed
          RuntimeReady:
            Type: Succeed
          ProvisioningSuperseded:
            Type: Succeed
          InvalidIdentity:
            Type: Fail
            Error: InvalidFederatedIdentity
            Cause: The requested subject is not a unique federated user in this deployment.
          ProvisioningFailed:
            Type: Fail
            Error: RuntimeProvisioningFailed
            Cause: The reviewed runtime stack did not reach CREATE_COMPLETE.
      Tags:
        - { Key: AgentFormationDeployment, Value: !Ref DeploymentName }

Outputs:
  StateMachineArn:
    Value: !Ref RuntimeProvisioningStateMachine
