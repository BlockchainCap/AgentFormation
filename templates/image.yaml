AWSTemplateFormatVersion: '2010-09-09'
Description: AgentFormation EC2 Image Builder pipeline for Claude Code and Codex runtimes.

Parameters:
  DeploymentName:
    Type: String
    AllowedPattern: '^(?!.*-runtime-)[a-z][a-z0-9-]{2,31}$'
  NetworkStackName:
    Type: String
    MinLength: 1
  Architecture:
    Type: String
    Default: arm64
    AllowedValues: [arm64, x86_64]
  BuildInstanceType:
    Type: String
    Default: c7g.large
    AllowedValues: [c7g.large, t4g.medium, c7i.large, t3.medium]
  AwsCliVersion:
    Type: String
    Default: 2.36.29
    AllowedPattern: '^\d+\.\d+\.\d+$'
  AwsCliInstallerSha256:
    Type: String
    Default: 80f4b79b35bb5c427261e8e9f0fd6959ad3513a697f6e37d823959a72cb654dc
    AllowedPattern: '^[0-9a-f]{64}$'
  NodeVersion:
    Type: String
    Default: 24.19.0
    AllowedPattern: '^\d+\.\d+\.\d+$'
  NodeArm64Sha256:
    Type: String
    Default: 01443c1e1a29e531ccad5a46fefa6df490d2189c49f7955904aecdbb0fe86fdc
    AllowedPattern: '^[0-9a-f]{64}$'
  NodeX64Sha256:
    Type: String
    Default: 14b342e71204f811bde6153be8e04b62aef63c236fef92b55f9c83154b409647
    AllowedPattern: '^[0-9a-f]{64}$'
  BunVersion:
    Type: String
    Default: 1.3.6
    AllowedPattern: '^\d+\.\d+\.\d+$'
  BunArm64Sha512:
    Type: String
    Default: 61a4040188c16a7a0e3ada6a93f73918671f648cb1208910da6d536c78de751989370c735818468a748044592b44873717ca51206028a572af27fdab8cdd4bcd
    AllowedPattern: '^[0-9a-f]{128}$'
  BunX64Sha512:
    Type: String
    Default: 7a07e7823d1d7c9f3af1c7f7d04ec1fb27bd29459279b631386e25f583f979678c5c2b5e9e97a7c74cdd2ad027f6ac498042729b900deadaed964f89eb1f0b8a
    AllowedPattern: '^[0-9a-f]{128}$'
  ClaudeCodeVersion:
    Type: String
    Default: 2.1.235
    AllowedPattern: '^\d+\.\d+\.\d+$'
  CodexVersion:
    Type: String
    Default: 0.148.0
    AllowedPattern: '^\d+\.\d+\.\d+([-.][A-Za-z0-9.]+)?$'
  CodexInstallerSha256:
    Type: String
    Default: ba92dd27e5c06f0d3bbc58bfa4b9cfb6599cd2742fbb1f92a2765e6c07dedb5a
    AllowedPattern: '^[0-9a-f]{64}$'
  AmiParameterPath:
    Type: String
    AllowedPattern: '^/[A-Za-z0-9/_.-]+$'
  ComponentVersion:
    Type: String
    Default: 1.0.0
    AllowedPattern: '^\d+\.\d+\.\d+$'

Conditions:
  IsArm: !Equals [!Ref Architecture, arm64]

Rules:
  MatchArchitectureAndBuilder:
    Assertions:
      - Assert: !Or
          - !And
            - !Equals [!Ref Architecture, arm64]
            - !Contains [[c7g.large, t4g.medium], !Ref BuildInstanceType]
          - !And
            - !Equals [!Ref Architecture, x86_64]
            - !Contains [[c7i.large, t3.medium], !Ref BuildInstanceType]
        AssertDescription: Build instance type must match the selected architecture.

Resources:
  LatestAmiParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Ref AmiParameterPath
      Type: String
      Value: ami-pending-build
      Description: Updated by the AgentFormation guided deploy command after an image build.
      Tags:
        AgentFormationDeployment: !Ref DeploymentName

  ImageBuilderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/EC2InstanceProfileForImageBuilder
      Tags:
        - { Key: AgentFormationDeployment, Value: !Ref DeploymentName }

  ImageBuilderInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref ImageBuilderRole]

  InstallToolsComponent:
    Type: AWS::ImageBuilder::Component
    Properties:
      Name: !Sub '${AWS::StackName}-install-tools'
      Platform: Linux
      Version: !Ref ComponentVersion
      Description: Install pinned Claude Code and Codex CLIs with runtime tools.
      Data: !Sub |
        name: InstallAgentFormationTools
        description: Install the AgentFormation runtime toolchain.
        schemaVersion: 1.0
        phases:
          - name: build
            steps:
              - name: InstallSystemPackages
                action: ExecuteBash
                inputs:
                  commands:
                    - set -euo pipefail
                    - export DEBIAN_FRONTEND=noninteractive
                    - apt-get update
                    - apt-get install -y --no-install-recommends bubblewrap build-essential ca-certificates curl docker-buildx docker.io git gnupg jq ripgrep tmux unzip xz-utils
                    - apt-get clean
                    - rm -rf /var/lib/apt/lists/*
              - name: InstallAwsCli
                action: ExecuteBash
                inputs:
                  commands:
                    - set -euo pipefail
                    - curl -fsSL https://awscli.amazonaws.com/v2/install.sh -o /tmp/install-aws-cli.sh
                    - echo "${AwsCliInstallerSha256}  /tmp/install-aws-cli.sh" | sha256sum -c -
                    - chmod 0755 /tmp/install-aws-cli.sh
                    - /tmp/install-aws-cli.sh --version ${AwsCliVersion} --system --quiet
                    - rm -f /tmp/install-aws-cli.sh
              - name: CreateRuntimeUser
                action: ExecuteBash
                inputs:
                  commands:
                    - set -euo pipefail
                    - id agentformation >/dev/null 2>&1 || useradd --create-home --shell /bin/bash agentformation
                    - usermod -aG docker agentformation
                    - install -d -m 0750 -o agentformation -g agentformation /workspace
                    - install -d -m 0700 -o agentformation -g agentformation /home/agentformation/.codex
                    - install -d -m 0755 -o agentformation -g agentformation /home/agentformation/.local/bin
              - name: InstallNode
                action: ExecuteBash
                inputs:
                  commands:
                    - set -euo pipefail
                    - if [[ "${Architecture}" == "arm64" ]]; then NODE_ARCH="arm64"; NODE_SHA256="${NodeArm64Sha256}"; else NODE_ARCH="x64"; NODE_SHA256="${NodeX64Sha256}"; fi
                    - curl -fsSL "https://nodejs.org/dist/v${NodeVersion}/node-v${NodeVersion}-linux-${!NODE_ARCH}.tar.xz" -o /tmp/node.tar.xz
                    - echo "${!NODE_SHA256}  /tmp/node.tar.xz" | sha256sum -c -
                    - tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
                    - rm -f /tmp/node.tar.xz
                    - node --version | grep -Fx "v${NodeVersion}"
                    - npm --version
              - name: InstallBun
                action: ExecuteBash
                inputs:
                  commands:
                    - set -euo pipefail
                    - if [[ "${Architecture}" == "arm64" ]]; then BUN_PACKAGE="bun-linux-aarch64"; BUN_SHA512="${BunArm64Sha512}"; else BUN_PACKAGE="bun-linux-x64"; BUN_SHA512="${BunX64Sha512}"; fi
                    - curl -fsSL "https://registry.npmjs.org/@oven/${!BUN_PACKAGE}/-/${!BUN_PACKAGE}-${BunVersion}.tgz" -o /tmp/bun.tgz
                    - echo "${!BUN_SHA512}  /tmp/bun.tgz" | sha512sum -c -
                    - tar -xzf /tmp/bun.tgz -C /tmp
                    - install -m 0755 /tmp/package/bin/bun /usr/local/bin/bun
                    - ln -sfn /usr/local/bin/bun /usr/local/bin/bunx
                    - rm -rf /tmp/bun.tgz /tmp/package
                    - bun --version | grep -Fx "${BunVersion}"
                    - bunx --version | grep -Fx "${BunVersion}"
              - name: InstallClaudeCode
                action: ExecuteBash
                inputs:
                  commands:
                    - set -euo pipefail
                    - export DEBIAN_FRONTEND=noninteractive
                    - install -d -m 0755 /etc/apt/keyrings
                    - curl -fsSL https://downloads.claude.ai/keys/claude-code.asc -o /etc/apt/keyrings/claude-code.asc
                    - gpg --show-keys /etc/apt/keyrings/claude-code.asc 2>&1 | tr -d ' ' | grep -F 31DDDE24DDFAB679F42D7BD2BAA929FF1A7ECACE
                    - echo "deb [signed-by=/etc/apt/keyrings/claude-code.asc] https://downloads.claude.ai/claude-code/apt/latest latest main" >/etc/apt/sources.list.d/claude-code.list
                    - apt-get update
                    - apt-get install -y --no-install-recommends claude-code=${ClaudeCodeVersion}-1
                    - apt-mark hold claude-code
                    - apt-get clean
                    - rm -rf /var/lib/apt/lists/*
              - name: InstallCodex
                action: ExecuteBash
                inputs:
                  commands:
                    - set -euo pipefail
                    - curl -fsSL https://chatgpt.com/codex/install.sh -o /tmp/install-codex.sh
                    - echo "${CodexInstallerSha256}  /tmp/install-codex.sh" | sha256sum -c -
                    - chmod 0755 /tmp/install-codex.sh
                    - sudo -u agentformation env HOME=/home/agentformation CODEX_HOME=/home/agentformation/.codex CODEX_INSTALL_DIR=/home/agentformation/.local/bin CODEX_RELEASE=${CodexVersion} CODEX_NON_INTERACTIVE=1 /tmp/install-codex.sh
                    - rm -f /tmp/install-codex.sh
              - name: HardenRuntime
                action: ExecuteBash
                inputs:
                  commands:
                    - set -euo pipefail
                    - snap refresh amazon-ssm-agent --channel=latest/stable
                    - systemctl enable docker
                    - chmod 0700 /home/agentformation/.codex
                    - chown -R agentformation:agentformation /home/agentformation /workspace
          - name: validate
            steps:
              - name: VerifyToolchain
                action: ExecuteBash
                inputs:
                  commands:
                    - set -euo pipefail
                    - test "$(/usr/bin/claude --version | awk '{print $1}')" = "${ClaudeCodeVersion}"
                    - dpkg-query -W claude-code | grep -F "${ClaudeCodeVersion}-1"
                    - apt-mark showhold | grep -Fx claude-code
                    - sudo -u agentformation env HOME=/home/agentformation /home/agentformation/.local/bin/codex --version | grep -F "${CodexVersion}"
                    - /usr/local/bin/aws --version | grep -F "aws-cli/${AwsCliVersion} "
                    - node --version | grep -Fx "v${NodeVersion}"
                    - bun --version | grep -Fx "${BunVersion}"
                    - bunx --version | grep -Fx "${BunVersion}"
                    - bwrap --version
                    - docker buildx version
                    - git --version
                    - tmux -V
          - name: test
            steps:
              - name: VerifyPackagedRuntime
                action: ExecuteBash
                inputs:
                  commands:
                    - set -euo pipefail
                    - test "$(/usr/bin/claude --version | awk '{print $1}')" = "${ClaudeCodeVersion}"
                    - dpkg-query -W claude-code | grep -F "${ClaudeCodeVersion}-1"
                    - apt-mark showhold | grep -Fx claude-code
                    - sudo -u agentformation env HOME=/home/agentformation /home/agentformation/.local/bin/codex --version | grep -F "${CodexVersion}"
                    - /usr/local/bin/aws --version | grep -F "aws-cli/${AwsCliVersion} "
                    - node --version | grep -Fx "v${NodeVersion}"
                    - bun --version | grep -Fx "${BunVersion}"
                    - bunx --version | grep -Fx "${BunVersion}"
                    - bwrap --version
                    - docker buildx version
                    - systemctl is-enabled docker
                    - systemctl is-active snap.amazon-ssm-agent.amazon-ssm-agent.service
                    - SSM_AGENT_VERSION="$(/snap/amazon-ssm-agent/current/amazon-ssm-agent -version | awk '{print $NF}')"
                    - dpkg --compare-versions "$SSM_AGENT_VERSION" ge 3.3.2746.0
                    - test -d /home/agentformation
                    - test "$(stat -c %U:%G /workspace)" = agentformation:agentformation

  ImageRecipe:
    Type: AWS::ImageBuilder::ImageRecipe
    Properties:
      Name: !Sub '${AWS::StackName}-recipe'
      Version: !Ref ComponentVersion
      ParentImage: !Sub
        - 'arn:${AWS::Partition}:imagebuilder:${AWS::Region}:aws:image/ubuntu-server-24-lts-${Arch}/x.x.x'
        - Arch: !If [IsArm, arm64, x86]
      Components:
        - ComponentArn: !Ref InstallToolsComponent
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true

  InfrastructureConfiguration:
    Type: AWS::ImageBuilder::InfrastructureConfiguration
    Properties:
      Name: !Sub '${AWS::StackName}-infrastructure'
      InstanceProfileName: !Ref ImageBuilderInstanceProfile
      InstanceTypes: [!Ref BuildInstanceType]
      SubnetId:
        Fn::ImportValue: !Sub '${NetworkStackName}-PrivateSubnetId'
      SecurityGroupIds:
        - Fn::ImportValue: !Sub '${NetworkStackName}-BuildSecurityGroupId'
      TerminateInstanceOnFailure: true
      ResourceTags:
        AgentFormationDeployment: !Ref DeploymentName

  DistributionConfiguration:
    Type: AWS::ImageBuilder::DistributionConfiguration
    Properties:
      Name: !Sub '${AWS::StackName}-distribution'
      Distributions:
        - Region: !Ref AWS::Region
          AmiDistributionConfiguration:
            Name: !Sub '${DeploymentName}-{{imagebuilder:buildDate}}'
            Description: AgentFormation runtime with pinned Claude Code and Codex CLIs.
            AmiTags:
              AgentFormationDeployment: !Ref DeploymentName

  ImagePipeline:
    Type: AWS::ImageBuilder::ImagePipeline
    Properties:
      Name: !Sub '${AWS::StackName}-pipeline'
      ImageRecipeArn: !Ref ImageRecipe
      InfrastructureConfigurationArn: !Ref InfrastructureConfiguration
      DistributionConfigurationArn: !Ref DistributionConfiguration
      Status: ENABLED
      ImageTestsConfiguration:
        ImageTestsEnabled: true
        TimeoutMinutes: 60
      Tags:
        AgentFormationDeployment: !Ref DeploymentName

Outputs:
  ImagePipelineArn:
    Value: !Ref ImagePipeline
  AmiParameterPath:
    Value: !Ref LatestAmiParameter
