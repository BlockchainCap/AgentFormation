AWSTemplateFormatVersion: '2010-09-09'
Description: AgentFormation shared identity, registry, uploads, and terminal session document.

Parameters:
  DeploymentName:
    Type: String
    Default: agentformation
    AllowedPattern: '^(?!.*-runtime-)[a-z][a-z0-9-]{2,31}$'
  CognitoDomainPrefix:
    Type: String
    AllowedPattern: '^[a-z0-9][a-z0-9-]{2,62}$'
  InitialCallbackUrl:
    Type: String
    Default: https://localhost/api/auth/callback/cognito
    AllowedPattern: '^https://[A-Za-z0-9.-]+(?::[0-9]{1,5})?/api/auth/callback/cognito$'
  InitialLogoutUrl:
    Type: String
    Default: https://localhost/
    AllowedPattern: '^https://[A-Za-z0-9.-]+(?::[0-9]{1,5})?/$'
  UploadAllowedOrigin:
    Type: String
    Default: https://localhost
    AllowedPattern: '^https://[A-Za-z0-9.-]+(?::[0-9]{1,5})?$'
  ConfigureIdentityCenterClient:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  ConfigureCaseInsensitiveUsernames:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']

Conditions:
  UseCaseInsensitiveUsernames: !Equals [!Ref ConfigureCaseInsensitiveUsernames, 'true']
  IdentityCenterClientEnabled: !Equals [!Ref ConfigureIdentityCenterClient, 'true']

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-users'
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      MfaConfiguration: 'OFF'
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      UsernameConfiguration: !If
        - UseCaseInsensitiveUsernames
        - { CaseSensitive: false }
        - !Ref AWS::NoValue
      UserPoolTags:
        AgentFormationDeployment: !Ref DeploymentName

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref UserPool

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Condition: IdentityCenterClientEnabled
    Properties:
      ClientName: !Sub '${AWS::StackName}-web'
      UserPoolId: !Ref UserPool
      GenerateSecret: true
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [IdentityCenter]
      CallbackURLs: [!Ref InitialCallbackUrl]
      LogoutURLs: [!Ref InitialLogoutUrl]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 1
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  UserRegistry:
    Type: AWS::DynamoDB::Table
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_119
            comment: AWS-managed DynamoDB encryption is enabled; a per-deployment customer key adds cost and key lifecycle risk without changing the app isolation boundary.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: userSub, AttributeType: S }
      KeySchema:
        - { AttributeName: userSub, KeyType: HASH }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      Tags:
        - { Key: AgentFormationDeployment, Value: !Ref DeploymentName }

  ControlState:
    Type: AWS::DynamoDB::Table
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_119
            comment: This table contains short-lived counters and claims only; AWS-managed encryption avoids a customer-key lifecycle for disposable coordination data.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: controlKey, AttributeType: S }
      KeySchema:
        - { AttributeName: controlKey, KeyType: HASH }
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      Tags:
        - { Key: AgentFormationDeployment, Value: !Ref DeploymentName }

  UploadBucket:
    Type: AWS::S3::Bucket
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: Account-wide audit logging belongs to the operator; a second project log bucket would retain employee object-access metadata and complicate complete cleanup.
          - id: CKV_AWS_21
            comment: This is a one-day staging bucket; versioning would retain deleted upload contents and make the documented privacy deletion behavior misleading.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: [content-type]
            AllowedMethods: [POST]
            AllowedOrigins: [!Ref UploadAllowedOrigin]
            ExposedHeaders: [ETag]
            MaxAge: 300
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      LifecycleConfiguration:
        Rules:
          - Id: ExpireUploads
            Status: Enabled
            Prefix: uploads/
            ExpirationInDays: 1
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }
          - Id: ExpireOldProvisioningTemplates
            Status: Enabled
            Prefix: provisioning/
            TagFilters:
              - Key: agentformation-lifecycle
                Value: superseded
            ExpirationInDays: 30
      Tags:
        - { Key: AgentFormationDeployment, Value: !Ref DeploymentName }

  UploadBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UploadBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::${UploadBucket}'
              - !Sub 'arn:${AWS::Partition}:s3:::${UploadBucket}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  WebRepository:
    Type: AWS::ECR::Repository
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_136
            comment: ECR uses AWS-managed encryption at rest; a customer key is optional operator policy, not an application trust-boundary control.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      EmptyOnDelete: true
      ImageScanningConfiguration: { ScanOnPush: true }
      ImageTagMutability: IMMUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Keep 10 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}'
      Tags:
        - { Key: AgentFormationDeployment, Value: !Ref DeploymentName }

  AuthSecret:
    Type: AWS::SecretsManager::Secret
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_149
            comment: Secrets Manager uses its AWS-managed encryption key; a customer key would add recurring cost and separate key deletion handling to this reference deployment.
    Properties:
      Description: AgentFormation Auth.js session secret.
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true
      Tags:
        - { Key: AgentFormationDeployment, Value: !Ref DeploymentName }

  CognitoClientSecret:
    Type: AWS::SecretsManager::Secret
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_149
            comment: Secrets Manager uses its AWS-managed encryption key; a customer key would add recurring cost and separate key deletion handling to this reference deployment.
    Properties:
      Description: Populated by the guided deploy command from the Cognito client.
      SecretString: pending-deploy
      Tags:
        - { Key: AgentFormationDeployment, Value: !Ref DeploymentName }

  TerminalSessionDocument:
    Type: AWS::SSM::Document
    Properties:
      Name: !Sub '${AWS::StackName}-terminal'
      DocumentType: Session
      UpdateMethod: NewVersion
      Content:
        schemaVersion: '1.0'
        description: Attach a browser terminal to a persistent AgentFormation tmux session.
        sessionType: Standard_Stream
        parameters:
          tmuxSession:
            type: String
            default: code
            allowedPattern: '^[A-Za-z0-9_-]{1,32}$'
        inputs:
          runAsEnabled: true
          runAsDefaultUser: agentformation
          idleSessionTimeout: '60'
          maxSessionDuration: '720'
          shellProfile:
            linux: |
              export HOME=/home/agentformation
              export USER=agentformation
              export LOGNAME=agentformation
              export SHELL=/bin/bash
              export PATH=/home/agentformation/.local/bin:/usr/local/bin:/usr/bin:/bin
              cd /workspace
              exec tmux set-option -g mouse on \; set-option -g history-limit 100000 \; new-session -A -s '{{ tmuxSession }}' -c /workspace
      Tags:
        - { Key: AgentFormationDeployment, Value: !Ref DeploymentName }

  UploadDeliveryDocument:
    Type: AWS::SSM::Document
    Properties:
      Name: !Sub '${AWS::StackName}-upload-delivery'
      DocumentType: Command
      UpdateMethod: NewVersion
      Content:
        schemaVersion: '2.2'
        description: Deliver one sealed upload to its assigned AgentFormation runtime.
        parameters:
          UploadBucket:
            type: String
            allowedPattern: '^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$'
            interpolationType: ENV_VAR
          UserSubject:
            type: String
            allowedPattern: '^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
            interpolationType: ENV_VAR
          UploadId:
            type: String
            allowedPattern: '^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
            interpolationType: ENV_VAR
          Filename:
            type: String
            allowedPattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,119}$'
            interpolationType: ENV_VAR
          TmuxSession:
            type: String
            allowedPattern: '^[A-Za-z0-9_-]{1,32}$'
            interpolationType: ENV_VAR
          FileSize:
            type: String
            allowedPattern: '^[1-9][0-9]{0,7}$'
            interpolationType: ENV_VAR
        mainSteps:
          - action: aws:runShellScript
            name: deliverUpload
            inputs:
              timeoutSeconds: '60'
              runCommand:
                - |
                  exec /bin/bash -euo pipefail <<'AGENTFORMATION_UPLOAD'
                  : "${SSM_UploadBucket:?missing UploadBucket}"
                  : "${SSM_UserSubject:?missing UserSubject}"
                  : "${SSM_UploadId:?missing UploadId}"
                  : "${SSM_Filename:?missing Filename}"
                  : "${SSM_TmuxSession:?missing TmuxSession}"
                  : "${SSM_FileSize:?missing FileSize}"
                  /usr/local/bin/node - /workspace/.uploads /home/agentformation <<'NODE'
                  const fs = require("node:fs");
                  const [uploadsDirectory, runtimeHome] = process.argv.slice(2);
                  try {
                    fs.mkdirSync(uploadsDirectory, { mode: 0o700 });
                  } catch (error) {
                    if (error?.code !== "EEXIST") throw error;
                  }
                  const directory = fs.openSync(
                    uploadsDirectory,
                    fs.constants.O_RDONLY |
                      fs.constants.O_DIRECTORY |
                      fs.constants.O_NOFOLLOW,
                  );
                  try {
                    const runtimeUser = fs.statSync(runtimeHome);
                    fs.fchownSync(directory, runtimeUser.uid, runtimeUser.gid);
                    fs.fchmodSync(directory, 0o700);
                  } finally {
                    fs.closeSync(directory);
                  }
                  NODE
                  runuser --user agentformation -- /bin/bash -euo pipefail -c '
                    upload_bucket="$1"
                    user_subject="$2"
                    upload_id="$3"
                    filename="$4"
                    tmux_session="$5"
                    file_size="$6"
                    destination_directory="/workspace/.uploads/${upload_id}"
                    destination="${destination_directory}/${filename}"
                    object_uri="s3://${upload_bucket}/uploads/${user_subject}/${upload_id}/sealed/${filename}"
                    /usr/bin/tmux has-session -t "$tmux_session"
                    install -d -m 0700 -- "$destination_directory"
                    partial_file="$(mktemp --tmpdir="$destination_directory" ".${filename}.XXXXXX.part")"
                    trap '\''rm -f -- "$partial_file"'\'' EXIT
                    chmod 0600 -- "$partial_file"
                    env HOME=/home/agentformation /usr/local/bin/aws s3 cp "$object_uri" "$partial_file" --only-show-errors
                    test "$(stat -c %s -- "$partial_file")" -eq "$file_size"
                    mv -f -- "$partial_file" "$destination"
                    trap - EXIT
                  ' agentformation "$SSM_UploadBucket" "$SSM_UserSubject" "$SSM_UploadId" "$SSM_Filename" "$SSM_TmuxSession" "$SSM_FileSize"
                  AGENTFORMATION_UPLOAD
      Tags:
        - { Key: AgentFormationDeployment, Value: !Ref DeploymentName }

  OAuthRelayDocument:
    Type: AWS::SSM::Document
    Properties:
      Name: !Sub '${AWS::StackName}-oauth-relay'
      DocumentType: Command
      UpdateMethod: NewVersion
      Content:
        schemaVersion: '2.2'
        description: Relay one staged OAuth loopback callback inside its assigned AgentFormation runtime.
        parameters:
          UploadBucket:
            type: String
            allowedPattern: '^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$'
            interpolationType: ENV_VAR
          UserSubject:
            type: String
            allowedPattern: '^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
            interpolationType: ENV_VAR
          RelayId:
            type: String
            allowedPattern: '^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
            interpolationType: ENV_VAR
        mainSteps:
          - action: aws:runShellScript
            name: relayOAuthCallback
            inputs:
              timeoutSeconds: '15'
              runCommand:
                - |
                  exec /bin/bash -euo pipefail <<'AGENTFORMATION_OAUTH'
                  : "${SSM_UploadBucket:?missing UploadBucket}"
                  : "${SSM_UserSubject:?missing UserSubject}"
                  : "${SSM_RelayId:?missing RelayId}"
                  object_uri="s3://${SSM_UploadBucket}/uploads/${SSM_UserSubject}/${SSM_RelayId}/oauth-callback.url"
                  /usr/local/bin/aws s3 cp "$object_uri" - --only-show-errors |
                    /usr/sbin/runuser --user agentformation -- /usr/local/bin/node -e '
                      const chunks = [];
                      let size = 0;
                      process.stdin.on("data", (chunk) => {
                        size += chunk.length;
                        if (size > 4096) process.exit(1);
                        chunks.push(chunk);
                      });
                      process.stdin.on("end", () => {
                        const payload = Buffer.concat(chunks, size);
                        const value = payload.toString("utf8");
                        try {
                          const url = new URL(value);
                          const port = Number(url.port);
                          if (
                            !Buffer.from(value, "utf8").equals(payload) ||
                            /[\u0000-\u001f\u007f]/.test(value) ||
                            url.protocol !== "http:" ||
                            url.hostname !== "127.0.0.1" ||
                            url.username ||
                            url.password ||
                            !/^\d+$/.test(url.port) ||
                            !Number.isInteger(port) ||
                            port < 1 ||
                            port > 65535 ||
                            !/^\/callback(?:\/[A-Za-z0-9_-]{8,128})?$/.test(url.pathname) ||
                            !url.search ||
                            url.hash ||
                            url.href !== value
                          ) {
                            process.exit(1);
                          }
                          const escaped = value
                            .replaceAll("\\", "\\\\")
                            .replaceAll("\"", "\\\"");
                          process.stdout.write(`url = "${escaped}"\n`);
                        } catch {
                          process.exit(1);
                        }
                      });
                    ' |
                    /usr/sbin/runuser --user agentformation -- /usr/bin/curl --disable --config - --interface 127.0.0.1 --proto '=http' --noproxy '*' --fail --silent --show-error --output /dev/null --max-time 5 --max-filesize 65536
                  AGENTFORMATION_OAUTH
      Tags:
        - { Key: AgentFormationDeployment, Value: !Ref DeploymentName }

Outputs:
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Condition: IdentityCenterClientEnabled
    Value: !Ref UserPoolClient
  CognitoIssuer:
    Value: !Sub 'https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${UserPool}'
  CognitoDomain:
    Value: !Sub 'https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com'
  CognitoSamlAcsUrl:
    Value: !Sub 'https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com/saml2/idpresponse'
  CognitoSamlAudience:
    Value: !Sub 'urn:amazon:cognito:sp:${UserPool}'
  UserRegistryTableName:
    Value: !Ref UserRegistry
  ControlTableName:
    Value: !Ref ControlState
  UploadBucketName:
    Value: !Ref UploadBucket
  WebRepositoryUri:
    Value: !GetAtt WebRepository.RepositoryUri
  WebRepositoryName:
    Value: !Ref WebRepository
  AuthSecretArn:
    Value: !Ref AuthSecret
  CognitoClientSecretArn:
    Value: !Ref CognitoClientSecret
  TerminalSessionDocumentName:
    Value: !Ref TerminalSessionDocument
  UploadDeliveryDocumentName:
    Value: !Ref UploadDeliveryDocument
  OAuthRelayDocumentName:
    Value: !Ref OAuthRelayDocument
