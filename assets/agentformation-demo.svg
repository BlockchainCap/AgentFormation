<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="720"
  viewBox="0 0 1200 720"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">A laptop using Codex in a remote AgentFormation workspace on AWS</title>
  <desc id="description">
    An animation showing a laptop opening an encrypted browser session to a
    private, persistent EC2 workspace in the user's AWS account. The App Runner
    web app starts an AWS Systems Manager Session Manager stream to a tmux
    session on private EC2. The laptop and cloud show that same synchronized
    AgentFormation session while Codex edits a project. The laptop then closes
    while EC2, encrypted EBS, tmux, and Codex keep running.
  </desc>

  <defs>
    <linearGradient id="terminal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c1f" />
      <stop offset="1" stop-color="#171719" />
    </linearGradient>
    <linearGradient id="progress" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed" />
      <stop offset="0.5" stop-color="#a78bfa" />
      <stop offset="1" stop-color="#22d3ee" />
    </linearGradient>
    <clipPath id="screen-clip">
      <rect x="38" y="36" width="1124" height="648" rx="18" />
    </clipPath>
    <clipPath id="prompt-clip">
      <rect class="prompt-reveal" x="90" y="244" width="0" height="43" />
    </clipPath>
  </defs>

  <style>
    text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
        "Liberation Mono", "Courier New", monospace;
    }

    .laptop-lid {
      animation: laptop-cycle 24s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      transform-box: view-box;
      transform-origin: 290px 462px;
    }

    .browser-connection {
      animation: browser-connection-cycle 24s ease-in-out infinite;
    }

    .closed-note,
    .cloud-continues {
      animation: show-closed-state 24s ease-in-out infinite;
      opacity: 0;
    }

    .connection-line {
      animation: connection-dashes 1.8s linear infinite;
    }

    .transfer-dot {
      animation: transfer 2.4s ease-in-out infinite;
    }

    .conversation {
      animation: conversation-cycle 24s ease-in-out infinite;
    }

    .prompt-reveal {
      animation: type-prompt 24s steps(32, end) infinite;
    }

    .thinking {
      animation: show-thinking 24s ease infinite;
    }

    .read-step {
      animation: show-read 24s ease infinite;
    }

    .edit-step {
      animation: show-edit 24s ease infinite;
    }

    .test-step {
      animation: show-test 24s ease infinite;
    }

    .answer {
      animation: show-answer 24s ease infinite;
    }

    .progress-bar {
      animation: progress-width 24s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
    }

    .activity-dot {
      animation: pulse 1.8s ease-in-out infinite;
    }

    .spinner-one {
      animation: spinner-dot 1.2s ease-in-out 0s infinite;
    }

    .spinner-two {
      animation: spinner-dot 1.2s ease-in-out 0.2s infinite;
    }

    .spinner-three {
      animation: spinner-dot 1.2s ease-in-out 0.4s infinite;
    }

    .cursor {
      animation: blink 1s steps(1, end) infinite;
    }

    @keyframes laptop-cycle {
      0%,
      50% {
        transform: scaleY(1);
      }
      59%,
      90% {
        transform: scaleY(0.035);
      }
      98%,
      100% {
        transform: scaleY(1);
      }
    }

    @keyframes browser-connection-cycle {
      0%,
      50% {
        opacity: 1;
      }
      57%,
      92% {
        opacity: 0;
      }
      98%,
      100% {
        opacity: 1;
      }
    }

    @keyframes show-closed-state {
      0%,
      55% {
        opacity: 0;
        transform: translateY(5px);
      }
      61%,
      90% {
        opacity: 1;
        transform: translateY(0);
      }
      96%,
      100% {
        opacity: 0;
      }
    }

    @keyframes connection-dashes {
      to {
        stroke-dashoffset: -28;
      }
    }

    @keyframes transfer {
      0%,
      100% {
        opacity: 0;
        transform: translateX(0);
      }
      15% {
        opacity: 1;
      }
      75% {
        opacity: 1;
      }
      90% {
        opacity: 0;
        transform: translateX(120px);
      }
    }

    @keyframes conversation-cycle {
      0%,
      94% {
        opacity: 1;
      }
      100% {
        opacity: 0;
      }
    }

    @keyframes type-prompt {
      0%,
      3% {
        width: 0;
      }
      16%,
      94% {
        width: 520px;
      }
      100% {
        width: 0;
      }
    }

    @keyframes show-thinking {
      0%,
      15% {
        opacity: 0;
        transform: translateY(6px);
      }
      19%,
      29% {
        opacity: 1;
        transform: translateY(0);
      }
      33%,
      100% {
        opacity: 0;
        transform: translateY(-4px);
      }
    }

    @keyframes show-read {
      0%,
      24% {
        opacity: 0;
        transform: translateY(7px);
      }
      29%,
      94% {
        opacity: 1;
        transform: translateY(0);
      }
      100% {
        opacity: 0;
      }
    }

    @keyframes show-edit {
      0%,
      38% {
        opacity: 0;
        transform: translateY(7px);
      }
      43%,
      94% {
        opacity: 1;
        transform: translateY(0);
      }
      100% {
        opacity: 0;
      }
    }

    @keyframes show-test {
      0%,
      59% {
        opacity: 0;
        transform: translateY(7px);
      }
      64%,
      94% {
        opacity: 1;
        transform: translateY(0);
      }
      100% {
        opacity: 0;
      }
    }

    @keyframes show-answer {
      0%,
      74% {
        opacity: 0;
        transform: translateY(8px);
      }
      79%,
      94% {
        opacity: 1;
        transform: translateY(0);
      }
      100% {
        opacity: 0;
      }
    }

    @keyframes progress-width {
      0%,
      16% {
        width: 0;
        opacity: 0;
      }
      20% {
        opacity: 1;
      }
      65% {
        width: 650px;
        opacity: 1;
      }
      70%,
      100% {
        width: 650px;
        opacity: 0;
      }
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 0.55;
      }
      50% {
        opacity: 1;
      }
    }

    @keyframes spinner-dot {
      0%,
      100% {
        opacity: 0.25;
        transform: translateY(0);
      }
      50% {
        opacity: 1;
        transform: translateY(-3px);
      }
    }

    @keyframes blink {
      0%,
      48% {
        opacity: 1;
      }
      49%,
      100% {
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .laptop-lid,
      .browser-connection,
      .closed-note,
      .cloud-continues {
        animation: none;
        transform: none;
      }

      .closed-note,
      .cloud-continues {
        display: none;
      }

      .conversation,
      .prompt-reveal,
      .read-step,
      .edit-step,
      .test-step,
      .answer,
      .activity-dot,
      .cursor {
        animation: none;
        opacity: 1;
        transform: none;
      }

      .prompt-reveal {
        width: 520px;
      }

      .thinking,
      .progress-bar {
        display: none;
      }

      .connection-line,
      .transfer-dot {
        animation: none;
      }
    }
  </style>

  <rect width="1200" height="720" fill="#09090b" />

  <g class="architecture">
    <text x="600" y="86" fill="#f4f4f5" font-size="28" font-weight="700" text-anchor="middle">
      Your browser attaches to a persistent EC2 workspace
    </text>
    <text x="600" y="115" fill="#8b8b93" font-size="14" text-anchor="middle">
      Session Manager reconnects to the same private tmux session.
    </text>

    <text x="290" y="168" fill="#71717a" font-size="11" font-weight="700" letter-spacing="1.4" text-anchor="middle">
      YOUR LAPTOP · BROWSER
    </text>
    <g class="laptop-lid">
      <rect x="82" y="187" width="416" height="275" rx="15" fill="#0b0b0d" stroke="#3f3f46" stroke-width="2" />
      <rect x="98" y="203" width="384" height="242" rx="7" fill="#151518" stroke="#27272a" />
      <g transform="translate(85 191) scale(0.342)">
        <use href="#agentformation-ui" />
      </g>
    </g>
    <path d="M58 462h464l-28 25H86z" fill="#18181b" stroke="#3f3f46" stroke-width="2" stroke-linejoin="round" />
    <line x1="222" y1="473" x2="358" y2="473" stroke="#52525b" stroke-width="2" stroke-linecap="round" />
    <text class="closed-note" x="290" y="520" fill="#a1a1aa" font-size="12" text-anchor="middle">
      Laptop closed
    </text>

    <g transform="translate(14 -14)">
      <path
        d="M706 520c-46 0-83-38-83-84 0-45 33-82 76-89 8-101 91-179 193-179 81 0 151 49 179 122 45 12 79 53 79 101 0 71-55 129-126 129z"
        fill="#0c0c0f"
        stroke="#3f3f46"
        stroke-width="2"
        stroke-linejoin="round"
      />
      <text x="800" y="214" fill="#f4f4f5" font-size="12" font-weight="700" letter-spacing="0.5">PRIVATE</text>
      <text x="868" y="214" fill="#ff9900" font-size="12" font-weight="700" letter-spacing="0.5">AWS</text>
      <text x="902" y="214" fill="#f4f4f5" font-size="12" font-weight="700" letter-spacing="0.5">EC2 RUNTIME</text>
      <text x="889" y="233" fill="#71717a" font-size="10" font-weight="700" letter-spacing="1.2" text-anchor="middle">
        VPC · PRIVATE SUBNET
      </text>
      <g transform="translate(724 255) scale(0.276)">
        <use href="#agentformation-ui" />
      </g>
      <text x="889" y="468" fill="#d4d4d8" font-size="10" font-weight="700" text-anchor="middle">
        tmux + Codex + /workspace
      </text>
      <text x="889" y="486" fill="#8b8b93" font-size="10" text-anchor="middle">
        Encrypted EBS · no public IP · no inbound rules
      </text>
    </g>

    <g class="browser-connection" transform="translate(-8 0)">
      <line
        class="connection-line"
        x1="530"
        y1="345"
        x2="650"
        y2="345"
        stroke="#71717a"
        stroke-width="2"
        stroke-dasharray="7 7"
      />
      <circle class="transfer-dot" cx="530" cy="345" r="5" fill="#a78bfa" />
      <rect x="522" y="298" width="146" height="27" rx="13.5" fill="#111114" stroke="#303036" />
      <g transform="translate(536 305) scale(0.55)" fill="none" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
      </g>
      <text x="563" y="316" fill="#d4d4d8" font-size="9">App Runner web app</text>
      <text x="590" y="371" fill="#8b8b93" font-size="9" text-anchor="middle">
        SSM Session Manager
      </text>
    </g>

    <text x="600" y="615" fill="#f4f4f5" font-size="14" text-anchor="middle">
      The browser renders the App Runner web app; Systems Manager attaches it to tmux on private EC2.
    </text>
    <text class="cloud-continues" x="600" y="642" fill="#a78bfa" font-size="11" text-anchor="middle">
      Laptop closed. EC2, encrypted EBS, tmux, and Codex keep running.
    </text>
  </g>

  <defs>
    <g id="agentformation-ui" clip-path="url(#screen-clip)">
    <rect x="38" y="36" width="1124" height="648" rx="18" fill="#09090b" stroke="#29292e" stroke-width="2" />

    <!-- Application header -->
    <rect x="38" y="36" width="1124" height="58" fill="#0a0a0c" />
    <line x1="38" y1="94" x2="1162" y2="94" stroke="#242428" />
    <text x="58" y="61" fill="#f4f4f5" font-size="15" font-weight="700">AgentFormation</text>
    <text x="58" y="80" fill="#71717a" font-size="11">developer@company.example · /workspace</text>
    <g transform="translate(1080 56)" fill="none" stroke="#a1a1aa" stroke-width="1.7" stroke-linecap="round">
      <circle cx="0" cy="0" r="6" />
      <path d="M0-11v3M0 8v3M-11 0h3M8 0h3M-8-8l2 2M6 6l2 2M8-8L6-6M-6 6l-2 2" />
    </g>
    <path d="M1120 49h10v14h-10M1127 56h-14m0 0 4-4m-4 4 4 4" fill="none" stroke="#a1a1aa" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Tabs -->
    <rect x="38" y="94" width="1124" height="50" fill="#08080a" />
    <line x1="38" y1="144" x2="1162" y2="144" stroke="#242428" />
    <rect x="48" y="102" width="116" height="34" rx="7" fill="#0d0d10" stroke="#1d1d21" />
    <text x="64" y="124" fill="#71717a" font-size="12">Terminal</text>
    <circle cx="136" cy="119" r="4" fill="#10b981" opacity="0.8" />
    <text x="149" y="124" fill="#52525b" font-size="14">×</text>
    <rect x="171" y="102" width="118" height="34" rx="7" fill="#131316" stroke="#2b2b31" />
    <text x="188" y="124" fill="#f4f4f5" font-size="12">Codex</text>
    <circle class="activity-dot" cx="256" cy="119" r="4" fill="#10b981" />
    <text x="273" y="124" fill="#71717a" font-size="14">×</text>
    <text x="1133" y="127" fill="#d4d4d8" font-size="24" text-anchor="middle">+</text>

    <!-- Codex terminal -->
    <rect x="48" y="153" width="1104" height="420" fill="url(#terminal)" />
    <rect x="64" y="169" width="386" height="63" fill="#19191c" stroke="#68686f" stroke-width="1" />
    <text x="80" y="192" fill="#8b8b93" font-size="12">model:</text>
    <text x="154" y="192" fill="#e4e4e7" font-size="13">gpt-5.6-sol xhigh</text>
    <text x="80" y="214" fill="#8b8b93" font-size="12">directory:</text>
    <text x="154" y="214" fill="#e4e4e7" font-size="13">/workspace</text>
    <text x="356" y="192" fill="#22d3ee" font-size="12">/model</text>

    <g class="conversation">
      <rect x="64" y="244" width="1072" height="43" fill="#343438" />
      <text x="78" y="270" fill="#d4d4d8" font-size="14">›</text>
      <g clip-path="url(#prompt-clip)">
        <text x="90" y="270" fill="#f4f4f5" font-size="14">Add a health check and test it.</text>
      </g>

      <g class="thinking">
        <text x="78" y="322" fill="#71717a" font-size="14">•</text>
        <text x="100" y="322" fill="#a1a1aa" font-size="13" font-style="italic">Exploring the workspace</text>
        <circle class="spinner-one" cx="290" cy="318" r="2.4" fill="#a78bfa" />
        <circle class="spinner-two" cx="300" cy="318" r="2.4" fill="#a78bfa" />
        <circle class="spinner-three" cx="310" cy="318" r="2.4" fill="#a78bfa" />
      </g>

      <rect class="progress-bar" x="100" y="337" width="0" height="2" rx="1" fill="url(#progress)" />

      <g class="read-step">
        <circle cx="80" cy="365" r="3" fill="#71717a" />
        <text x="100" y="370" fill="#a1a1aa" font-size="13">Read</text>
        <text x="145" y="370" fill="#71717a" font-size="13">14 files and found the existing API patterns</text>
      </g>

      <g class="edit-step">
        <circle cx="80" cy="401" r="3" fill="#22d3ee" />
        <text x="100" y="406" fill="#e4e4e7" font-size="13">Edited</text>
        <text x="158" y="406" fill="#a1a1aa" font-size="13">the route and added focused coverage</text>
      </g>

      <g class="test-step">
        <circle cx="80" cy="437" r="3" fill="#84cc16" />
        <text x="100" y="442" fill="#e4e4e7" font-size="13">Ran</text>
        <text x="135" y="442" fill="#a1a1aa" font-size="13">48 tests · formatting · types · production build</text>
        <text x="490" y="442" fill="#84cc16" font-size="13">✓</text>
      </g>

      <g class="answer">
        <circle cx="80" cy="483" r="3" fill="#a78bfa" />
        <text x="100" y="488" fill="#f4f4f5" font-size="14">Done — the health check is covered and the production build passes.</text>
        <text x="100" y="514" fill="#a1a1aa" font-size="13">The change is ready for review.</text>
      </g>
    </g>

    <!-- Codex and tmux status lines -->
    <rect x="48" y="531" width="1104" height="22" fill="#18181a" />
    <text x="66" y="547" fill="#f4d6a0" font-size="11">gpt-5.6-sol xhigh</text>
    <text x="198" y="547" fill="#71717a" font-size="11">·</text>
    <text x="214" y="547" fill="#f59e7b" font-size="11">Context 4% used</text>
    <text x="329" y="547" fill="#71717a" font-size="11">·</text>
    <text x="345" y="547" fill="#d984c7" font-size="11">258K window</text>
    <rect x="48" y="553" width="1104" height="20" fill="#4b9d00" />
    <text x="58" y="568" fill="#071500" font-size="11" font-weight="700">[code] 0:codex*</text>
    <text x="1138" y="568" fill="#071500" font-size="11" text-anchor="end">"workspace"</text>

    <!-- Browser terminal controls -->
    <rect x="38" y="584" width="1124" height="100" fill="#09090b" />
    <line x1="38" y1="584" x2="1162" y2="584" stroke="#242428" />

    <g font-size="11" text-anchor="middle">
      <g fill="#111114" stroke="#303036">
        <rect x="54" y="597" width="52" height="27" rx="6" />
        <rect x="113" y="597" width="48" height="27" rx="6" />
        <rect x="168" y="597" width="58" height="27" rx="6" />
        <rect x="233" y="597" width="61" height="27" rx="6" />
        <rect x="301" y="597" width="61" height="27" rx="6" />
        <rect x="369" y="597" width="74" height="27" rx="6" />
        <rect x="450" y="597" width="96" height="27" rx="6" />
        <rect x="553" y="597" width="78" height="27" rx="6" />
      </g>
      <g
        fill="none"
        stroke="#d4d4d8"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <g transform="translate(461 603) scale(0.5)">
          <path d="M4.037 4.688a.495.495 0 0 1 .651-.651l16 6.5a.5.5 0 0 1-.063.947l-6.124 1.58a2 2 0 0 0-1.438 1.435l-1.579 6.126a.5.5 0 0 1-.947.063z" />
        </g>
        <g transform="translate(562 603) scale(0.5)">
          <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
          <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
        </g>
      </g>
      <g fill="#d4d4d8">
        <text x="80" y="615">Tab</text>
        <text x="137" y="615">Esc</text>
        <text x="197" y="615">Ctrl+C</text>
        <text x="264" y="615">Ctrl+O</text>
        <text x="331" y="615">Clear</text>
        <text x="406" y="615">New Line</text>
        <text x="508" y="615">Select text</text>
        <text x="604" y="615">Copy</text>
      </g>
    </g>

    <rect x="54" y="636" width="44" height="36" rx="7" fill="#111114" stroke="#303036" />
    <g
      transform="translate(68 646) scale(0.667)"
      fill="none"
      stroke="#d4d4d8"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="m16 6-8.414 8.586a2 2 0 0 0 2.829 2.829l8.414-8.586a4 4 0 1 0-5.657-5.657l-8.379 8.551a6 6 0 1 0 8.485 8.485l8.379-8.551" />
    </g>

    <rect x="106" y="636" width="918" height="36" rx="7" fill="#111114" stroke="#29292e" />
    <text x="124" y="659" fill="#71717a" font-size="12">Paste or type here — keystrokes go live…</text>
    <rect class="cursor" x="124" y="646" width="2" height="17" fill="#a78bfa" />

    <rect x="1034" y="636" width="112" height="36" rx="7" fill="#8b5cf6" />
    <g
      transform="translate(1048 646) scale(0.667)"
      fill="none"
      stroke="#160d24"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M20 4v7a4 4 0 0 1-4 4H4" />
      <path d="m9 10-5 5 5 5" />
    </g>
    <text x="1088" y="659" fill="#160d24" font-size="12" font-weight="700">Enter</text>
    </g>
  </defs>
</svg>
